services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: warranty
      POSTGRES_PASSWORD: warranty
      POSTGRES_DB: warranty_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warranty -d warranty_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
